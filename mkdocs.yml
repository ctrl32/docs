site_name: ctrl32
site_description: HMI and PLC for small machines on a single ESP32 panel
site_author: Pavol Krnáč
site_url: https://www.ctrl32.com/docs/
copyright: © Pavol Krnáč, Slovakia

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: light theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: dark theme

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys

plugins:
  - search:
      lang: [en]

nav:
  - What ctrl32 is: index.md
  - Quick start: quickstart.md
  - Editor:
      - Layout and how to work in it: editor.md
      - Tags: tags.md
      - Screens and widgets: widgets.md
  - Programming:
      - Ladder (LD): ladder.md
      - Function block diagram (FBD): fbd-composites.md
      - Structured Text (ST): st-language.md
  - Buses and peripherals:
      - Modbus: modbus.md
      - Raw CAN: rawcan.md
      - MQTT: mqtt.md
      - Peripherals and services: peripherals-and-services.md
      - Adding a peripheral: adding-peripherals.md
  - Deployment:
      - Download to the panel: deploy.md
      - Licensing: licensing.md
  - Operation:
      - Online monitoring: online.md
      - Scope: scope.md
      - Performance and limits: limits.md
      - Troubleshooting: troubleshooting.md
